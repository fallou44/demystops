apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demystops-ingress
  namespace: demystops
spec:
  rules:
  - host: demystops.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: demystops-service
            port:
              number: 8081