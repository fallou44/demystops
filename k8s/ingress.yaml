apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demystops-ingress
  namespace: demystops
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure  # ← Clé importante
spec:
  tls:
  - hosts:
    - demystops.com
    secretName: demystops-tls
  rules:
  - host: demystops.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: demystops-service
            port:
              number: 8081