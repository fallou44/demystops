# k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demystops
  namespace: demystops
  labels:
    app: demystops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demystops
  template:
    metadata:
      labels:
        app: demystops
    spec:
      containers:
      - name: demystops
        image: sasow/demystops:1.0.35
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: demystops-secrets
              key: SMTP_HOST
        - name: SMTP_PORT
          valueFrom:
            secretKeyRef:
              name: demystops-secrets
              key: SMTP_PORT
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: demystops-secrets
              key: SMTP_USER
        - name: SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: demystops-secrets
              key: SMTP_PASS
        - name: SMTP_SECURE
          valueFrom:
            secretKeyRef:
              name: demystops-secrets
              key: SMTP_SECURE
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"